# Server
spring.application.name=brandradar-backend
server.port=${PORT:8080}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0

# GROQ AI
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.3-70b-versatile

# YouTube API
youtube.api.key=${YOUTUBE_API_KEY}
youtube.api.url=https://www.googleapis.com/youtube/v3

# SociaVault API
sociavault.api.key=${SOCIAVAULT_API_KEY}
sociavault.api.url=${SOCIAVAULT_API_URL:https://api.sociavault.com/v1/scrape}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000
jwt.refresh.expiration.ms=604800000

# CORS
allowed.origins=${ALLOWED_ORIGINS:http://localhost:4200}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

springdoc.packages-to-scan=brandradar
springdoc.paths-to-match=/api/**

# Abrir navegador automáticamente
spring.devtools.restart.enabled=true

# Uploads
app.uploads.dir=${APP_UPLOADS_DIR:uploads}
